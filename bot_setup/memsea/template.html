<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佳树的记忆星海</title>
<!-- 模板：bot_setup\tools\memsea.py 把数据填进下面 id="sea-data" 那个标签。灵感来自 asdfd3/3d-memory-sea（MIT），代码是重写的。 -->
<style>
:root {
  color-scheme: dark;
  --bg: #03040a;
  --panel: rgba(12, 15, 28, 0.74);
  --line: rgba(150, 175, 255, 0.15);
  --line-strong: rgba(170, 190, 255, 0.3);
  --text: #e9ecf7;
  --muted: #8f98b6;
  --faint: #5f6889;
  --accent: #ffce6e;
  --radius: 12px;
  --font: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font); }
#sea { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
#sea.dragging { cursor: grabbing; }
#sea.pointing { cursor: pointer; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#side { position: fixed; left: 22px; top: 18px; max-width: min(430px, calc(100vw - 44px)); display: flex; flex-direction: column; gap: 14px; pointer-events: none; }
#side > * { pointer-events: auto; }
#title { pointer-events: none !important; }
#title h1 {
  margin: 0; font-size: 23px; font-weight: 700; letter-spacing: .05em;
  background: linear-gradient(90deg, #ffe0a0, #ffb0d4 55%, #b8a5ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#title .tag { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
#title .stats { margin: 8px 0 0; font-size: 12px; color: var(--faint); line-height: 1.6; }
#title .warn { color: #e8a06a; }

#legend { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 8px; min-width: 150px; padding: 5px 11px 5px 9px;
  font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  transition: opacity .15s, border-color .15s;
}
.chip:hover { border-color: var(--line-strong); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 9px var(--c); flex: none; }
.chip .n { margin-left: auto; padding-left: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: none; border: 1px solid var(--c); }

#tools { position: fixed; right: 22px; top: 18px; display: flex; gap: 8px; align-items: center; }
.search { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 12px; }
.search svg { flex: none; opacity: .6; }
.search input { width: 190px; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13px; }
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { filter: invert(.7); }
#qn { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 0; }
.tool {
  height: 36px; padding: 0 13px; font-size: 13px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.tool:hover { border-color: var(--line-strong); }
.tool[aria-pressed="true"] { color: var(--accent); border-color: rgba(255, 206, 110, .5); }

#card { position: fixed; right: 22px; top: 68px; bottom: 86px; width: 370px; overflow: auto; padding: 18px 18px 14px; overscroll-behavior: contain; }
#card[hidden] { display: none; }
#card .close {
  position: sticky; top: 0; float: right; margin: -6px -6px 0 8px; width: 30px; height: 30px; border-radius: 8px;
  background: rgba(255,255,255,.04); border: 1px solid var(--line); cursor: pointer; font-size: 16px; line-height: 1;
}
.badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--c); }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
#card h2 { margin: 8px 0 2px; font-size: 18px; font-weight: 700; line-height: 1.4; }
#card h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
#card .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
#card .brief { margin: 10px 0 0; padding-left: 10px; border-left: 2px solid var(--c); color: #f3d9cf; font-size: 13px; }
#card .text { margin: 12px 0 0; font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
#card h3 { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
#card .sum { margin: 6px 0 0; font-size: 12.5px; line-height: 1.7; color: #c6cbe0; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.kw { padding: 2px 9px; font-size: 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); cursor: pointer; }
.kw:hover { border-color: var(--line-strong); }
.link-cluster { display: block; width: 100%; text-align: left; padding: 8px 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-size: 13.5px; }
.link-cluster:hover { border-color: var(--line-strong); }
.nbrs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.nbrs button {
  display: grid; grid-template-columns: 9px 1fr; column-gap: 9px; width: 100%; text-align: left; padding: 7px 8px;
  background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-size: 12.5px; line-height: 1.55;
}
.nbrs button:hover { background: rgba(255,255,255,.04); border-color: var(--line); }
.nbrs .dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--c); }
.nbrs .who { color: var(--muted); font-size: 11.5px; }
.nbrs .rel { color: var(--accent); font-size: 11.5px; margin-left: 4px; }
.more { font-size: 12px; color: var(--faint); margin-top: 6px; }
.grav { color: var(--muted); letter-spacing: .02em; }
.grav.g2 { color: #f2cf8a; }
.grav.g3 { color: #ffe296; font-weight: 600; text-shadow: 0 0 8px rgba(255, 210, 120, .45); }
#card .gline { margin-top: 4px; }
.chip.heavy { margin-top: 4px; }

#tip { position: fixed; z-index: 5; pointer-events: none; max-width: 300px; padding: 8px 11px; font-size: 12.5px; line-height: 1.55; }
#tip[hidden] { display: none; }
#tip b { font-weight: 600; }
#tip .when { color: var(--muted); font-size: 11.5px; }

#timeline {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(740px, calc(100vw - 44px));
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px;
}
#b-play { width: 34px; height: 34px; flex: none; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: pointer; font-size: 13px; }
#b-play:hover { border-color: var(--line-strong); }
#slider { flex: 1; min-width: 60px; accent-color: var(--accent); }
#tlabel { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#hint { position: fixed; left: 22px; bottom: 26px; font-size: 11.5px; color: var(--faint); line-height: 1.6; pointer-events: none; }
#empty { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.9; pointer-events: none; }
#empty[hidden] { display: none; }

@media (max-width: 1180px) { #hint { display: none; } }
@media (max-width: 760px) {
  #side { left: 16px; right: 16px; top: 12px; max-width: none; gap: 10px; }
  #title h1 { font-size: 19px; }
  #title .tag, #title .stats { display: none; }
  #legend { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip { min-width: 0; flex: none; }
  #tools { left: 16px; right: 16px; top: auto; bottom: 68px; }
  .search { flex: 1; min-width: 0; }
  .search input { width: 100%; }
  .tool { padding: 0 10px; }
  #card { left: 16px; right: 16px; top: auto; bottom: 116px; width: auto; max-height: 50vh; }
  #timeline { width: calc(100vw - 32px); bottom: 12px; }
  #tlabel { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="sea" aria-label="佳树的记忆星海：可以拖动旋转的 3D 星图"></canvas>

<div id="side">
  <header id="title">
    <h1>佳树的记忆星海</h1>
    <p class="tag">每一颗星，都是她真的记得的一件事</p>
    <p class="stats" id="stats"></p>
  </header>
  <div id="legend" role="group" aria-label="显示哪些星"></div>
</div>

<div id="tools">
  <label class="search panel">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="找一句话、一个名字…" autocomplete="off" aria-label="搜索记忆">
    <span id="qn" aria-live="polite"></span>
  </label>
  <button id="b-spin" class="tool" aria-pressed="true" title="自动慢慢转（空格）">旋转</button>
  <button id="b-label" class="tool" aria-pressed="false" title="显示每颗星的句子（L）">句子</button>
  <button id="b-reset" class="tool" title="回到全景（R）">复位</button>
</div>

<aside id="card" class="panel" hidden aria-live="polite"></aside>
<div id="tip" class="panel" hidden></div>

<footer id="timeline" class="panel">
  <button id="b-play" aria-label="回放：看星海一点点长出来" title="回放：看星海一点点长出来">▶</button>
  <input id="slider" type="range" min="0" max="1000" value="1000" step="1" aria-label="时间">
  <span id="tlabel"></span>
</footer>
<div id="hint">拖动旋转 · 右键或 Shift 拖动平移 · 滚轮缩放<br>点星星看原话 · 双击飞过去 · 离中心越远越新</div>
<div id="empty" hidden>还没有能画的记忆。<br>等佳树和大家聊上几句、写过日记，再来看看吧。</div>

<script id="sea-data" type="application/json">__SEA_DATA__</script>
<script>
(() => {
'use strict';

// ============================================================ 数据
let DATA = null;
try { DATA = JSON.parse(document.getElementById('sea-data').textContent); } catch (e) { DATA = null; }
if (!DATA || typeof DATA !== 'object') DATA = {};
const META = DATA.meta || {};
const P = DATA.points || [], C = DATA.clusters || [], E = DATA.edges || [];
const ARMS = DATA.arms || [], DAYS = DATA.days || [];
const OWNER = META.owner_title || '兄长大人', SELF = META.self_name || '佳树';

const KIND = {
  owner:  { label: OWNER + '说的', rgb: [255, 204, 104] },
  self:   { label: SELF + '说的',  rgb: [255, 138, 194] },
  other:  { label: '群友说的',      rgb: [108, 172, 255] },
  memory: { label: '长期记忆',      rgb: [176, 148, 255] },
  heart:  { label: '她心里想的',    rgb: [255, 96, 132] },
  fact:   { label: '对人的了解',    rgb: [98, 226, 184] },
  diary:  { label: '日记',          rgb: [255, 126, 98] },
  note:   { label: '此刻记着',      rgb: [228, 236, 255] },
  me:     { label: '关于自己',      rgb: [238, 162, 255] },
  know:   { label: '她知道的',      rgb: [170, 232, 106] },
};
const ORDER = ['owner', 'self', 'other', 'memory', 'heart', 'fact', 'me', 'know', 'diary', 'note'];
const ARM_RGB = [[255, 186, 150], [132, 164, 255], [118, 226, 196], [226, 156, 255], [255, 220, 120], [150, 220, 255]];
const EDGE_RGB = { t: [140, 160, 230], r: [178, 152, 255], s: [104, 228, 186], w: [255, 208, 136] };
const EDGE_A = { t: 0.15, r: 0.2, s: 0.42, w: 0.27 };
// 分量（记忆轻重插件打的分）：0 琐碎闲聊 · 1 一般 · 2 要紧 · 3 郑重；没打过分的星不变
const GNAME = Object.assign({ 0: '琐碎闲聊', 1: '一般', 2: '要紧', 3: '郑重' }, META.gravity_names || {});
const GSCALE = { 0: 0.62, 1: 1, 2: 1.6, 3: 2.3 };
const GOLD = [255, 226, 150];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ============================================================ 小工具
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const snip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const pad = n => String(n).padStart(2, '0');
const OFF = (META.tz_offset_min == null ? 480 : META.tz_offset_min) * 60;
const local = t => new Date((t + OFF) * 1000);
const WEEK = '日一二三四五六';
function fmtFull(t) { const d = local(t); return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日 周${WEEK[d.getUTCDay()]} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function fmtShort(t) { const d = local(t); return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日 ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function fmtSpan(a, b) {
  const da = local(a), db = local(b);
  const same = da.getUTCMonth() === db.getUTCMonth() && da.getUTCDate() === db.getUTCDate();
  return fmtShort(a) + ' – ' + (same ? `${pad(db.getUTCHours())}:${pad(db.getUTCMinutes())}` : fmtShort(b));
}
function hash32(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const gauss = r => (r() + r() + r() - 1.5) / 1.5;
const isMsg = p => p.k === 'owner' || p.k === 'self' || p.k === 'other';

// ============================================================ 布局
// 每个聊天一条旋臂；半径 = 时间（聊得密的地方拉开，长时间没说话的地方压短）；
// 一条旋臂上，兄长大人 / 佳树 / 群友的话各走一股，绕着旋臂拧成"对话的螺旋"；
// 长期记忆浮在它总结的那段对话上方；对人的了解、关于自己、她知道的、日记、此刻记着在星系中心。
const armOf = {};
ARMS.forEach((a, i) => { armOf[a.chat] = i; });
const NA = Math.max(1, ARMS.length);
const members = C.map(() => []);
P.forEach(p => { if (members[p.c]) members[p.c].push(p); });
C.forEach((c, i) => {
  const ms = members[i].filter(isMsg), src = ms.length ? ms : members[i];
  c.n = members[i].length;
  c.t0 = src.length ? Math.min(...src.map(p => p.t)) : 0;
  c.t1 = src.length ? Math.max(...src.map(p => p.t)) : 0;
  c.arm = c.chat != null && c.chat in armOf ? armOf[c.chat] : -1;
});

const R0 = 240, STEP = 1.8, GAPK = 11, SPIN = 1.9;
const evs = [];
P.forEach(p => { if (isMsg(p) && C[p.c].arm >= 0) evs.push({ t: p.t, id: p.id, p }); });
// 只有长期记忆、没有聊天记录的星团（比如开始记聊天记录之前的事）也占一个位置
C.forEach((c, i) => { if (c.arm >= 0 && c.n && !members[i].some(isMsg)) evs.push({ t: (c.t0 + c.t1) / 2, id: -1, p: null }); });
evs.sort((a, b) => a.t - b.t || a.id - b.id);
const EVT = new Float64Array(evs.length), EVR = new Float64Array(evs.length);
{
  let r = R0;
  evs.forEach((e, i) => {
    if (i) r += STEP + GAPK * Math.log1p(Math.max(0, e.t - evs[i - 1].t) / 900);
    EVT[i] = e.t; EVR[i] = r; if (e.p) e.p.r = r;
  });
}
function radiusAt(t) {
  const n = EVT.length;
  if (!n) return R0;
  if (t <= EVT[0]) return Math.max(R0 * 0.82, R0 - GAPK * Math.log1p((EVT[0] - t) / 900));
  if (t >= EVT[n - 1]) return EVR[n - 1] + GAPK * Math.log1p((t - EVT[n - 1]) / 900);
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (EVT[m] <= t) lo = m; else hi = m; }
  const span = EVT[hi] - EVT[lo];
  return EVR[lo] + (EVR[hi] - EVR[lo]) * (span > 0 ? (t - EVT[lo]) / span : 0);
}
function armFrame(a, r) {
  const th = (a / NA) * Math.PI * 2 + SPIN * Math.log(Math.max(1, r) / R0) + 0.35;
  const c = Math.cos(th), s = Math.sin(th);
  let tx = c - SPIN * s, tz = s + SPIN * c;
  const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
  return { x: r * c, y: Math.sin(r * 0.0045 + a * 2.1) * 34, z: r * s, tx, tz, nx: -tz, nz: tx };
}

const PHASE = { owner: 0, self: 2.094, other: 4.189 };
C.forEach((c, i) => {
  if (!c.n) return;
  if (c.arm >= 0) {
    for (const p of members[i]) {
      if (!isMsg(p)) continue;
      const R = rng(hash32('m' + p.id + ':' + p.t));
      const r = p.r + gauss(R) * 3;
      const f = armFrame(c.arm, r);
      const amp = 13 + r * 0.012, j = 4.5 + r * 0.004;
      const phi = PHASE[p.k] + r * 0.085;
      const o1 = Math.cos(phi) * amp + gauss(R) * j, o2 = Math.sin(phi) * amp * 0.8 + gauss(R) * j * 0.7, o3 = gauss(R) * j;
      p.x = f.x + f.nx * o1 + f.tx * o3; p.y = f.y + o2; p.z = f.z + f.nz * o1 + f.tz * o3;
    }
    const mems = members[i].filter(p => !isMsg(p));
    const f = armFrame(c.arm, radiusAt((c.t0 + c.t1) / 2));
    mems.forEach((p, k) => {
      const R = rng(hash32('k' + p.id));
      const along = (k - (mems.length - 1) / 2) * 26;
      p.x = f.x + f.tx * along + f.nx * gauss(R) * 10;
      p.y = f.y + 68 + (k % 2) * 16 + gauss(R) * 5;
      p.z = f.z + f.tz * along + f.nz * gauss(R) * 10;
    });
    c.cx = f.x; c.cy = f.y + 30; c.cz = f.z;
    c.lx = f.x; c.ly = f.y + (mems.length ? 112 : 50); c.lz = f.z;
    c.glow = 62 + 11 * Math.sqrt(c.n);
  }
});
const coreIds = C.map((c, i) => i).filter(i => C[i].arm < 0 && C[i].n);
coreIds.forEach((i, k) => {
  const c = C[i];
  const ang = (k / coreIds.length) * Math.PI * 2 + 0.6;
  const cr = coreIds.length > 1 ? 104 : 0;
  const cx = Math.cos(ang) * cr, cy = 18, cz = Math.sin(ang) * cr;
  const R = 14 + 9 * Math.sqrt(c.n);
  for (const p of members[i]) {
    const g = rng(hash32('c' + p.id));
    const u = g() * 2 - 1, th = g() * Math.PI * 2, rad = R * Math.pow(g(), 0.6), s = Math.sqrt(1 - u * u);
    p.x = cx + rad * s * Math.cos(th); p.y = cy + rad * u * 0.75; p.z = cz + rad * s * Math.sin(th);
  }
  Object.assign(c, { cx, cy, cz, lx: cx, ly: cy + R * 0.75 + 26, lz: cz, glow: 40 + 10 * Math.sqrt(c.n) });
});
let RMAX = R0;
P.forEach(p => {
  if (p.x == null) { p.x = 0; p.y = 0; p.z = 0; }
  RMAX = Math.max(RMAX, Math.hypot(p.x, p.z));

      ctx.globalAlpha = big ? 1 : clamp(0.35 + p.sf * 0.9 + (p.g === 3 ? 0.25 : 0), 0.35, 0.9);
      ctx.fillStyle = p.g === 3 && !big ? rgba(GOLD, 1) : rgba(KIND[p.k].rgb.map(v => Math.round(v * 0.35 + 255 * 0.65)), 1);
      ctx.fillText(text, p.sx + dx, p.sy);
    }
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================================ 界面
function buildLegend() {
  const counts = {};
  P.forEach(p => { counts[p.k] = (counts[p.k] || 0) + 1; });
  const box = $('legend');
  box.innerHTML = '';
  ORDER.forEach(k => {
    if (!counts[k]) return;
    const b = document.createElement('button');
    b.className = 'chip';
    b.style.setProperty('--c', rgba(KIND[k].rgb, 1));
    b.setAttribute('aria-pressed', 'true');
    b.innerHTML = `<span class="dot"></span><span>${esc(KIND[k].label)}</span><span class="n">${counts[k]}</span>`;
    b.addEventListener('click', () => {
      kindOn[k] = !kindOn[k];
      b.setAttribute('aria-pressed', String(kindOn[k]));
      updateVis(performance.now());
      if (sel >= 0 && !P[sel].vis) closeCard();
      runSearch();
    });
    box.appendChild(b);
  });
  const heavy = P.filter(p => p.g >= 2).length;
  if (heavy) {
    const b = document.createElement('button');
    b.className = 'chip heavy';
    b.style.setProperty('--c', rgba(GOLD, 1));
    b.setAttribute('aria-pressed', 'false');
    b.title = '只留记忆轻重里「要紧」「郑重」的星（星越大分量越重，暗下去的是快忘了的）';
    b.innerHTML = `<span class="dot"></span><span>只看要紧的</span><span class="n">${heavy}</span>`;
    b.addEventListener('click', () => {
      heavyOnly = !heavyOnly;
      b.setAttribute('aria-pressed', String(heavyOnly));
      updateVis(performance.now());
      if (sel >= 0 && !P[sel].vis) closeCard();
      runSearch();
    });
    box.appendChild(b);
  }
}
function gravityLine(p) {
  if (p.g == null) return '';
  const dots = '●'.repeat(p.g) + '○'.repeat(3 - p.g);
  let s = `<span class="grav g${p.g}">${dots} ${esc(GNAME[p.g] || '')}</span>`;
  if (p.ret != null) s += ` · 还记得 ${Math.round(p.ret * 100)}%`;
  if (p.uses) s += ` · 用上过 ${p.uses} 次`;
  if (p.keep && p.keep.said > 1) s += ` · 说过 ${p.keep.said} 次`;
  if (p.keep && p.keep.retired) s += ' · 已经淡忘';
  return `<div class="meta gline">${s}</div>`;
}

function stats() {
  const n = P.length, c = META.counts || {};
  const clusters = C.filter(x => x.n).length;
  let html = `${n} 颗星 · ${OWNER}说过的 ${c.owner || 0} 句 · ${clusters} 个星团`;
  const heavy = P.filter(p => p.g >= 2).length, grave = P.filter(p => p.g === 3).length;
  if (heavy) html += `<br>要紧的 ${heavy} 颗，其中郑重的 ${grave} 颗（星越大分量越重，暗的是快忘了的）`;
  if (META.generated) html += `<br>生成于 ${esc(fmtShort(META.generated))} · 控制台再点「记忆星海」就是最新的`;
  (META.warnings || []).forEach(w => { html += `<br><span class="warn">⚠ ${esc(w)}</span>`; });
  $('stats').innerHTML = html;
}

function setTimeline(v, now) {
  tl = v;
  $('slider').value = String(Math.round(v));
  const N = byTime.length;
  if (v >= 1000 || !N) {
    Tcur = Infinity;
    $('tlabel').textContent = N ? `全部 ${N} 颗 · 到 ${fmtShort(TMAX)}` : '';
  } else {
    const cnt = Math.floor((v / 1000) * N);
    Tcur = cnt <= 0 ? -Infinity : byTime[Math.min(N, cnt) - 1].t;
    $('tlabel').textContent = cnt <= 0 ? '最开始' : `${fmtShort(Tcur)} · ${cnt} 颗`;
  }
  updateVis(now == null ? performance.now() : now);
  if (sel >= 0 && !P[sel].vis) closeCard();
}

const REL = {
  t: () => '前后句',
  r: (me, o) => (me.k === 'memory' ? '总结自这句' : me.k === 'heart' ? '那时她心里' : me.k === 'diary' ? '写进日记的事' :
                me.k === 'note' ? '记在心上的事' : o.k === 'memory' ? '被记进这条长期记忆' : o.k === 'heart' ? '这时她心里想的' :
                o.k === 'diary' ? '写进了这篇日记' : o.k === 'note' ? '她正记着' : '相关'),
  s: (me, o) => (me.k === 'fact' ? '记下它时的那句话' : me.k === 'know' ? '学到它时的那句话' :
                 o.k === 'know' ? '从这句学到的' : '从这句记下的事'),
  w: () => '说到同一件事',
};
const REL_ORDER = { s: 0, r: 1, w: 2, t: 3 };

function whoLine(p) {
  if (p.k === 'diary') return esc(p.who || '日记');
  let s = esc(p.who || KIND[p.k].label);
  if (p.nick && p.nick !== p.who) s += `<small>${esc(p.nick)}</small>`;
  return s;
}

function showPoint(id, fly) {
  const p = P[id]; if (!p) return;
  sel = id; selCluster = -1; updateFocus();
  const c = C[p.c] || {};
  const rgb = KIND[p.k].rgb;
  const where = p.where ? ' · ' + esc(p.where) : '';
  let html = `<button class="close" aria-label="关闭">×</button>`;
  html += `<div class="badge" style="--c:${rgba(rgb, 1)}">${esc(KIND[p.k].label)}</div>`;
  html += `<h2>${whoLine(p)}</h2><div class="meta">${esc(fmtFull(p.t))}${where}</div>`;
  html += gravityLine(p);
  if (p.brief) html += `<p class="brief" style="--c:${rgba(rgb, 1)}">${esc(p.brief)}</p>`;
  if (p.keep && p.keep.memory) html += `<p class="brief" style="--c:${rgba(GOLD, 1)}">她铭记在心：${esc(p.keep.memory)}</p>`;
  html += `<p class="text">${esc(p.text)}</p>`;
  if (p.kw && p.kw.length) html += `<div class="kws">${p.kw.map(k => `<button class="kw" data-q="${esc(k)}">#${esc(k)}</button>`).join('')}</div>`;
  if (c.label) {
    html += `<h3>所在星团</h3><button class="link-cluster" data-c="${p.c}">${esc(c.label)}</button>`;
    if (c.summary && p.k !== 'memory' && p.k !== 'heart') html += `<p class="sum">${esc(snip(c.summary, 140))}</p>`;
  }
  const nb = adj[id].map(k => {
    const e = E[k], o = P[e[0] === id ? e[1] : e[0]];
    return { o, e };
  }).filter(x => x.o).sort((a, b) => REL_ORDER[a.e[3]] - REL_ORDER[b.e[3]] || b.e[2] - a.e[2] || a.o.t - b.o.t);
  if (nb.length) {
    html += `<h3>连着的星（${nb.length}）</h3><ul class="nbrs">`;
    nb.slice(0, 12).forEach(({ o, e }) => {
      html += `<li><button data-p="${o.id}" style="--c:${rgba(KIND[o.k].rgb, 1)}"><span class="dot"></span><span>` +
        `<span class="who">${esc(o.who || KIND[o.k].label)} · ${esc(fmtShort(o.t))}</span><span class="rel">${esc((REL[e[3]] || REL.w)(p, o))}</span><br>` +
        `${esc(snip(o.text, 60))}</span></button></li>`;
    });
    html += `</ul>`;
    if (nb.length > 12) html += `<div class="more">还有 ${nb.length - 12} 颗</div>`;
  }
  openCard(html);
  if (fly) flyTo(p.x, p.y, p.z, Math.min(goal.dist, Math.max(260, RMAX * 0.42)));
}

function showCluster(i, fly) {
  const c = C[i]; if (!c || !c.n) return;
  sel = -1; selCluster = i; updateFocus();
  const ms = members[i].slice().sort((a, b) => (isMsg(a) - isMsg(b)) || a.t - b.t);
  const kindCount = {};
  ms.forEach(p => { kindCount[p.k] = (kindCount[p.k] || 0) + 1; });
  const parts = ORDER.filter(k => kindCount[k]).map(k => `${KIND[k].label} ${kindCount[k]}`).join(' · ');
  const tag = c.kind === 'episode' ? '记忆片段' : c.kind === 'session' ? '一段闲聊' : '她心里';
  const where = c.chat ? ' · ' + esc((ARMS[c.arm] || {}).label || '') : '';
  let html = `<button class="close" aria-label="关闭">×</button>`;
  html += `<div class="badge" style="--c:${rgba(c.arm >= 0 ? ARM_RGB[c.arm % ARM_RGB.length] : [255, 222, 196], 1)}">${tag}</div>`;
  html += `<h2>${esc(c.label)}</h2><div class="meta">${esc(fmtSpan(c.t0, c.t1))}${where}<br>${esc(parts)}</div>`;
  if (c.summary) html += `<p class="text">${esc(c.summary)}</p>`;
  const kws = (c.keywords || []).filter(Boolean);
  if (kws.length) html += `<div class="kws">${kws.map(k => `<button class="kw" data-q="${esc(k)}">#${esc(k)}</button>`).join('')}</div>`;
  html += `<h3>这里的星（${ms.length}）</h3><ul class="nbrs">`;
  ms.slice(0, 40).forEach(o => {
    html += `<li><button data-p="${o.id}" style="--c:${rgba(KIND[o.k].rgb, 1)}"><span class="dot"></span><span>` +
      `<span class="who">${esc(o.who || KIND[o.k].label)} · ${esc(fmtShort(o.t))}</span><br>${esc(snip(o.text, 60))}</span></button></li>`;
  });
  html += `</ul>`;
  if (ms.length > 40) html += `<div class="more">还有 ${ms.length - 40} 颗</div>`;
  openCard(html);
  if (fly) flyTo(c.cx, c.cy, c.cz, Math.min(goal.dist, Math.max(300, c.glow * 5)));
}

function openCard(html) {
  const card = $('card');
  card.innerHTML = html;
  card.hidden = false; cardOpen = true;
  card.scrollTop = 0;
}
function closeCard() {
  sel = -1; selCluster = -1; updateFocus();
  $("card").hidden = true; cardOpen = false;
}
$('card').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.classList.contains('close')) closeCard();
  else if (t.dataset.p != null) showPoint(+t.dataset.p, true);
  else if (t.dataset.c != null) showCluster(+t.dataset.c, true);
  else if (t.dataset.q != null) { $('q').value = t.dataset.q; runSearch(); closeCard(); }
});

function flyTo(x, y, z, dist) {
  goal.tx = x; goal.ty = y; goal.tz = z;
  if (dist) goal.dist = clamp(dist, MIND, MAXD);
}
function resetView() {  // 转回默认角度时走近路，不倒转好几圈
  Object.assign(goal, DEFAULT);
  goal.yaw = DEFAULT.yaw + Math.round((cam.yaw - DEFAULT.yaw) / (Math.PI * 2)) * Math.PI * 2;
}

// 搜索
function hay(p) {
  if (!p._hay) p._hay = [p.text, p.who, p.nick, p.where, p.brief, (C[p.c] || {}).label, (p.kw || []).join(' '),
    p.g != null ? GNAME[p.g] : '', p.keep ? p.keep.memory : ''].filter(Boolean).join('\n').toLowerCase();
  return p._hay;
}
function runSearch() {
  query = $('q').value.trim().toLowerCase();
  matches = query ? P.filter(p => p.vis && hay(p).includes(query)) : null;
  matchIdx = -1;
  $('qn').textContent = matches ? String(matches.length) : '';
  updateFocus();
}
$('q').addEventListener('input', runSearch);
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && matches && matches.length) {
    const list = matches.slice().sort((a, b) => a.t - b.t);
    matchIdx = (matchIdx + 1) % list.length;
    showPoint(list[matchIdx].id, true);
    $('qn').textContent = `${matchIdx + 1}/${list.length}`;
  } else if (e.key === 'Escape') {
    $('q').value = ''; runSearch(); $('q').blur();
  }
});

// 按钮
function setPressed(id, on) { $(id).setAttribute('aria-pressed', String(on)); }
$('b-spin').addEventListener('click', () => { spin = !spin; setPressed('b-spin', spin); });
$('b-label').addEventListener('click', () => { labelsOn = !labelsOn; setPressed('b-label', labelsOn); });
$('b-reset').addEventListener('click', () => { closeCard(); resetView(); });
setPressed('b-spin', spin);
let introPlay = false;
$('b-play').addEventListener('click', () => {
  if (playing) { playing = false; $('b-play').textContent = '▶'; return; }
  introPlay = false;
  if (tl >= 1000) setTimeline(0);
  playing = true; $('b-play').textContent = '❚❚';
});
$('slider').addEventListener('input', e => { playing = false; introPlay = false; $('b-play').textContent = '▶'; setTimeline(+e.target.value); });

// ============================================================ 鼠标 / 触摸
let drag = null;
const pointers = new Map();
let pinch = null;
function pick(x, y) {
  let best = -1, bd = 1e9;
  for (const p of P) {
    if (!p.ok) continue;
    const r = Math.max(9, clamp(p.size * p.sf * 1.45, 0.75, 13) * 2.2);
    const dx = p.sx - x, dy = p.sy - y, d = dx * dx + dy * dy;
    if (d > r * r) continue;
    const score = d - p.sf * 40;  // 一样近时，挑离镜头近的
    if (score < bd) { bd = score; best = p.id; }
  }
  return best;
}
function pickCluster(x, y) {
  for (let i = 0; i < C.length; i++) {
    const r = C[i].rect;
    if (r && x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]) return i;
  }
  return -1;
}
function showTip(id, x, y) {
  const tip = $('tip');
  if (id < 0) { tip.hidden = true; return; }
  const p = P[id], rgb = KIND[p.k].rgb;
  tip.innerHTML = `<b style="color:${rgba(rgb, 1)}">${esc(p.who || KIND[p.k].label)}</b> <span class="when">${esc(fmtShort(p.t))}${p.where ? ' · ' + esc(p.where) : ''}${p.g >= 2 ? ' · <span class="grav g' + p.g + '">' + esc(GNAME[p.g]) + '</span>' : ''}</span><br>${esc(snip(p.text, 70))}`;
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = clamp(x + 16, 8, W - w - 8) + 'px';
  tip.style.top = clamp(y + 16, 8, H - h - 8) + 'px';
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    drag = null;
    return;
  }
  drag = { x: e.clientX, y: e.clientY, moved: 0, pan: e.button === 2 || e.shiftKey || e.button === 1 };
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch.d > 0 && d > 0) { goal.dist = clamp(goal.dist * pinch.d / d, MIND, MAXD); cam.dist = goal.dist; }
    pan(mx - pinch.mx, my - pinch.my);
    pinch = { d, mx, my };
    return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved < 4) return;
    $('tip').hidden = true;
    if (drag.pan) pan(dx, dy);
    else {
      cam.yaw = goal.yaw = cam.yaw + dx * 0.005;  // 左右拖：离镜头近的那一侧跟着鼠标走
      cam.pitch = goal.pitch = clamp(cam.pitch + dy * 0.005, -1.45, 1.45);
    }
    return;
  }
  hover = pick(e.clientX, e.clientY);
  hoverCluster = hover < 0 ? pickCluster(e.clientX, e.clientY) : -1;
  canvas.classList.toggle('pointing', hover >= 0 || hoverCluster >= 0);
  showTip(hover, e.clientX, e.clientY);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  canvas.classList.remove('dragging');
  if (drag && drag.moved < 5 && e.type === 'pointerup') {
    const id = pick(e.clientX, e.clientY);
    if (id >= 0) showPoint(id, false);
    else {
      const ci = pickCluster(e.clientX, e.clientY);
      if (ci >= 0) showCluster(ci, true); else closeCard();
    }
  }
  drag = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { if (!drag) { hover = -1; hoverCluster = -1; $('tip').hidden = true; } });
canvas.addEventListener('dblclick', e => {
  const id = pick(e.clientX, e.clientY);
  if (id >= 0) showPoint(id, true);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const scale = Math.exp(clamp(e.deltaY, -240, 240) * 0.0012);
  goal.dist = clamp(goal.dist * scale, MIND, MAXD);
}, { passive: false });
function pan(dx, dy) {
  const f0 = FOCAL / cam.dist;
  const rx = CY, rz = -SY;                 // 屏幕向右在世界里的方向
  const ux = SP * SY, uy = CP, uz = SP * CY; // 屏幕向上在世界里的方向
  const mx = -dx / f0, my = dy / f0;
  cam.tx = goal.tx = cam.tx + rx * mx + ux * my;
  cam.ty = goal.ty = cam.ty + uy * my;
  cam.tz = goal.tz = cam.tz + rz * mx + uz * my;
}

window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Escape') closeCard();
  else if (e.key === ' ') { e.preventDefault(); spin = !spin; setPressed('b-spin', spin); }
  else if (e.key === 'r' || e.key === 'R') { closeCard(); resetView(); }
  else if (e.key === 'l' || e.key === 'L') { labelsOn = !labelsOn; setPressed('b-label', labelsOn); }
});
window.addEventListener('resize', resize);

// ============================================================ 开始
buildLegend();
stats();
if (!P.length) {
  $('empty').hidden = false;
  $('timeline').hidden = true;
}
Object.assign(goal, DEFAULT);
Object.assign(cam, DEFAULT, { dist: DEFAULT.dist * 1.7, yaw: DEFAULT.yaw + 0.9 });
if (!REDUCED && P.length) { introPlay = true; playing = true; setTimeline(0); $('b-play').textContent = '❚❚'; }
else setTimeline(1000);
requestAnimationFrame(t => { last = t; frame(t); });

// 给自测用：读当前状态
window.__sea = { P, C, E, cam, goal, showPoint, showCluster, closeCard, setTimeline, state: () => ({ sel, selCluster, Tcur, tl, playing, matches: matches && matches.length }) };
})();
</script>
</body>
